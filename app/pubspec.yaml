name: shift_diary
description: "Дневник смен водителя"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  dio: ^5.11.1
  dartz: ^0.10.1
  equatable: ^3.0.0
  go_router: ^17.5.0
  uuid: ^4.6.0
  # Версию задаёт flutter_localizations.
  intl: any
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Тексты интерфейса генерируются из lib/l10n/app_ru.arb (см. l10n.yaml).
  generate: true
