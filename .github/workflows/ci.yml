name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет ещё не законченную проверку предыдущего.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Сервер — линтер, типы, тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Зависимости строго по uv.lock
        run: uv sync --frozen
      - name: Линтер
        run: uv run ruff check .
      - name: Форматирование
        run: uv run ruff format --check .
      - name: Типы
        run: uv run mypy shift_diary tests
      - name: Тесты
        run: uv run pytest -q

  server-image:
    name: Сервер — образ собирается и отвечает
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Сборка образа
        run: docker build -f server/Dockerfile -t shift-diary-server .
      - name: Запуск и проба API
        run: |
          docker run -d --name server -p 8000:8000 shift-diary-server
          curl --fail --silent --retry 20 --retry-delay 1 --retry-all-errors http://localhost:8000/health
          # Образец загружен: в ответе должны быть пять дней с поездками.
          test "$(curl --fail --silent http://localhost:8000/api/days | jq '.days | length')" = 5
      - name: Журнал сервера
        if: always()
        run: docker logs server

  app:
    name: Приложение — анализатор, тесты, APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          # Та же версия, что в разработке.
          flutter-version: "3.38.6"
          channel: stable
          cache: true
      - name: Зависимости строго по pubspec.lock
        run: flutter pub get --enforce-lockfile
      - name: Сгенерированные тексты соответствуют app_ru.arb
        run: flutter gen-l10n && git diff --exit-code lib/l10n
      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Анализатор
        run: flutter analyze
      # Раннер работает в UTC, разработка — в UTC+5: тесты, зависящие от пояса машины,
      # здесь бы упали.
      - name: Тесты
        run: flutter test
      - name: Релизный APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - uses: actions/upload-artifact@v7
        with:
          name: shift-diary-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
