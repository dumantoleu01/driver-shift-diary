[project]
name = "shift-diary-server"
version = "0.1.0"
description = "API дневника смен водителя"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Это приложение, а не библиотека: собирать и устанавливать его как пакет незачем.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# DTZ ловит datetime без пояса — главный источник ошибок в этом проекте.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PT"]
# Кириллица в строках, докстрингах и комментариях — намеренно.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.13"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
